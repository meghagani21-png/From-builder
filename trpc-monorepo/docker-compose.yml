services:
  postgresdb:
    image: postgres:15
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mydb

    ports:
      - "5433:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: